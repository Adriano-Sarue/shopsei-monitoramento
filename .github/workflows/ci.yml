name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: shopsei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:teste@localhost:5432/shopsei_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida o docker-compose de implantação
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Monta a imagem e confere o /healthz
        run: |
          docker build -t shopsei-app .
          docker run -d --name app -e ADMIN_SENHA=teste-ci-123456 -p 8090:8090 shopsei-app
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz && exit 0; sleep 1; done
          docker logs app; exit 1
