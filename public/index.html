<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fila · Shop Sei Monitoramento</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="resumo">
  <div class="cartao numero"><b id="n-aguardando">0</b><span class="mute">Aguardando</span></div>
  <div class="cartao numero"><b id="n-pendente">0</b><span class="mute">Pendentes</span></div>
  <div class="cartao numero"><b id="n-em_atendimento">0</b><span class="mute">Em atendimento</span></div>
  <div class="espaco"></div>
  <span id="feed" class="feed" title="Quando chegou o último evento de qualquer central. Se ficar vermelho, o feed pode ter parado.">Aguardando eventos…</span>
  <label class="mute" style="margin:0;display:flex;gap:6px;align-items:center"><input id="som" type="checkbox" style="width:auto"> Bip de avisos</label>
  <div class="disp"><span class="bolinha" id="bolinha"></span><span id="estado" class="mute">Indisponível</span><button id="disp" class="principal">Ficar disponível</button></div>
</div>
<div id="erro" class="msg erro" style="padding:6px 20px 0"></div>
<main class="colunas">
  <section class="coluna"><h2>Aguardando atendimento</h2><div id="aguardando"></div></section>
  <section class="coluna"><h2>Pendente (adiado ou em espera)</h2><div id="pendente"></div></section>
  <section class="coluna"><h2>Em atendimento</h2><div id="em_atendimento"></div></section>
</main>

<dialog id="dlg-concluir">
  <form method="dialog" id="form-concluir">
    <h3>Concluir ocorrência</h3>
    <p class="mute" id="dlg-resumo" style="margin:0 0 14px"></p>
    <label>Motivo <input id="motivo" list="motivos" required placeholder="Ex.: Acionamento indevido">
      <datalist id="motivos"><option value="Acionamento indevido"><option value="Alarme falso"><option value="Falha de energia do cliente"><option value="Falha de comunicação"><option value="Contato com o cliente realizado"><option value="Providências acionadas"></datalist>
    </label>
    <label>Texto da conclusão (opcional) <textarea id="conclusao" rows="3"></textarea></label>
    <div id="dlg-erro" class="msg erro"></div>
    <div class="botoes"><button type="button" id="cancelar">Cancelar</button><button class="principal" type="submit">Concluir</button></div>
  </form>
</dialog>

<script src="/app.js"></script>
<script>
const store = { get: (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* sem armazenamento */ } } };
const NIVEIS = { 1: 'Crítico', 2: 'Alto', 3: 'Médio', 4: 'Baixo' };
let eu, disponivel = false, conhecidas = null, concluindo = null, ultimaLista = [];
$('som').checked = store.get('som') !== '0';
$('som').onchange = () => store.set('som', $('som').checked ? '1' : '0');

function bip() {
  if (!$('som').checked) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.15; o.start(); o.stop(ctx.currentTime + 0.35);
  } catch { /* navegador bloqueou o áudio */ }
}

function aviso(texto) { $('erro').textContent = texto; }

// "Ciente" no disparo: já abre a primeira câmera do cliente numa aba nova (precisa ser no clique, senão o navegador
// bloqueia a janela); as outras ficam nos botões do cartão.
function cienteDoDisparo(o) {
  const cam = o.cliente && o.cliente.cameras && o.cliente.cameras[0];
  if (cam) window.open(cam.url, '_blank', 'noopener');
  return anotar(o, 'Ciente do disparo, iniciando atendimento' + (cam ? ' (câmera ' + cam.nome + ' aberta)' : ''));
}
const rascunhos = {};

async function anotar(o, descricao) {
  try { await api('/api/ocorrencias/' + o.id + '/acoes', { method: 'POST', body: JSON.stringify({ descricao }) }); await load(); return true; } catch (e) { aviso(e.message); return false; }
}

function card(o, nova) {
  const p = Math.min(o.prioridade, 4);
  const c = el('div', 'cartao ocorrencia p' + p + (nova ? ' nova' : '') + (o.alarme && o.situacao !== 'pendente' ? ' disparo' : ''));
  const l1 = el('div', 'linha');
  l1.append(el('span', 'titulo', 'Conta ' + o.conta + (o.cliente ? ' · ' + o.cliente.nome : '')), el('span', 'selo p' + p, NIVEIS[p]));
  c.append(l1);
  const l2 = el('div', 'linha'); l2.append(el('span', '', o.resumo), el('span', 'mute', haQuanto(o.abertaEm))); c.append(l2);
  if (!o.contaCadastrada) c.append(el('div', 'aviso', 'Conta não cadastrada'));
  if (o.cliente && o.cliente.endereco) c.append(el('div', 'mute', o.cliente.endereco));
  if (o.cliente && o.situacao === 'em_atendimento') {
    if (o.cliente.palavraChave || o.cliente.contraSenha) c.append(el('div', 'chaves', 'Palavra-chave: ' + (o.cliente.palavraChave || '-') + '  ·  Contra-senha: ' + (o.cliente.contraSenha || '-')));
    if (o.cliente.cameras && o.cliente.cameras.length) {
      const cams = el('div', 'cameras');
      for (const cam of o.cliente.cameras) { const a = el('a', '', '📹 ' + cam.nome + (cam.marca ? ' · ' + cam.marca : '')); a.href = cam.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; cams.append(a); }
      c.append(cams);
    }
    if (o.cliente.instrucoes) { const ins = el('div', 'instrucoes'); ins.append(el('strong', '', 'Instruções do cliente: '), document.createTextNode(o.cliente.instrucoes)); c.append(ins); }
    if (o.cliente.contatos.length) {
      const d = el('div', 'providencias');
      for (const ct of o.cliente.contatos) {
        const linha = el('div', 'contato');
        const nome = el('span', '', ct.ordem + '. ' + ct.nome + (ct.telefone ? ' · ' : ''));
        if (ct.telefone) { const a = el('a', '', ct.telefone); a.href = 'tel:' + ct.telefone.replace(/[^\d+]/g, ''); nome.append(a); }
        linha.append(nome);
        if (o.operador === eu.nome) {
          const bs = el('span', 'ligacao');
          for (const [rotulo, texto] of [['Atendeu', 'atendeu'], ['Não atendeu', 'não atendeu'], ['Recado', 'deixei recado']]) {
            const b = el('button', 'mini', rotulo);
            b.onclick = () => anotar(o, 'Ligação para ' + ct.nome + (ct.telefone ? ' · ' + ct.telefone : '') + ': ' + texto);
            bs.append(b);
          }
          linha.append(bs);
        }
        d.append(linha);
      }
      c.append(d);
    }
  }
  if (o.situacao === 'em_atendimento' && o.operador === eu.nome) {
    const pl = el('div', 'plano');
    pl.append(el('div', 'rotulo', 'Plano de ação'));
    for (const item of o.plano) {
      const l = el('label', 'passo' + (item.feito ? ' feito' : ''));
      const cb = el('input'); cb.type = 'checkbox'; cb.checked = item.feito; cb.disabled = item.feito;
      cb.onchange = () => anotar(o, 'Passo concluído: ' + item.passo);
      l.append(cb, document.createTextNode(' ' + item.passo));
      pl.append(l);
    }
    c.append(pl);
    const nota = el('form', 'nota');
    const campo = el('input'); campo.placeholder = 'Anotar (ex.: polícia acionada, viatura 12)'; campo.maxLength = 500;
    campo.value = rascunhos[o.id] || ''; campo.dataset.ocorrencia = o.id;
    campo.oninput = () => { rascunhos[o.id] = campo.value; };
    const ok = el('button', '', 'Anotar'); ok.type = 'submit';
    nota.onsubmit = (ev) => { ev.preventDefault(); if (campo.value.trim()) anotar(o, campo.value.trim()).then((feito) => { if (feito) delete rascunhos[o.id]; }); };
    nota.append(campo, ok); c.append(nota);
  }
  if (o.acoes.length) {
    const h = el('ul', 'historico-acoes');
    for (const a of o.acoes.slice(-5)) h.append(el('li', '', hora(a.em) + ' · ' + (a.operador ? a.operador + ': ' : '') + a.descricao));
    c.append(h);
  }
  const ev = el('ul', 'eventos');
  for (const e of o.eventos.slice(-4)) ev.append(el('li', '', hora(e.em) + ' · ' + e.codigo + ' ' + e.descricao + (e.zona ? ' · zona ' + e.zona : '')));
  c.append(ev);
  if (o.operador) c.append(el('div', 'mute', 'Operador: ' + o.operador));
  if (o.adiadaAte) c.append(el('div', 'mute', 'Volta à fila às ' + hora(o.adiadaAte)));
  if (o.situacao === 'em_atendimento' && o.operador === eu.nome) {
    const a = el('div', 'acoes');
    const concluir = el('button', 'principal', 'Concluir');
    concluir.onclick = () => { concluindo = o; $('dlg-resumo').textContent = 'Conta ' + o.conta + (o.cliente ? ' · ' + o.cliente.nome : '') + ' · ' + o.resumo; $('motivo').value = ''; $('conclusao').value = ''; $('dlg-erro').textContent = ''; $('dlg-concluir').showModal(); $('motivo').focus(); };
    const adiar = el('select'); adiar.style.width = 'auto';
    adiar.append(new Option('Adiar…', ''), new Option('15 minutos', '15'), new Option('30 minutos', '30'), new Option('1 hora', '60'));
    adiar.onchange = async () => {
      if (!adiar.value) return;
      try { await api('/api/ocorrencias/' + o.id + '/adiar', { method: 'POST', body: JSON.stringify({ ate: new Date(Date.now() + Number(adiar.value) * 60000).toISOString() }) }); toast('Ocorrência adiada'); load(); } catch (e) { aviso(e.message); adiar.value = ''; }
    };
    a.append(concluir, adiar); c.append(a);
  }
  return c;
}

const LIMITE_SILENCIO_MIN = 10;
function mostrarFeed(st) {
  const f = $('feed');
  const base = new Date(st.ultimoEventoEm || st.iniciadoEm).getTime();
  const min = Math.floor((new Date(st.agora).getTime() - base) / 60000);
  const ruim = min >= LIMITE_SILENCIO_MIN;
  f.className = 'feed' + (ruim ? ' ruim' : '');
  f.textContent = st.ultimoEventoEm
    ? (ruim ? '⚠ Sem eventos há ' + min + ' min. Confira o Active Net' : 'Último evento ' + haQuanto(st.ultimoEventoEm))
    : (ruim ? '⚠ Nenhum evento desde que o sistema iniciou (' + min + ' min)' : 'Aguardando eventos…');
}

async function load() {
  try {
    const [lista, st, voce] = await Promise.all([api('/api/ocorrencias'), api('/api/estado'), api('/api/eu')]);
    mostrarFeed(st);
    if (eu.nome && voce.disponivel !== disponivel) { disponivel = voce.disponivel; mostrarEstado(); }
    ultimaLista = lista; aviso('');
    const ids = new Set(lista.map((o) => o.id));
    const novas = conhecidas ? lista.filter((o) => !conhecidas.has(o.id)) : [];
    conhecidas = ids;
    if (novas.some((o) => o.prioridade <= 2 && !o.alarme) || (novas.length && disponivel && novas.some((o) => o.operador === eu.nome && !o.alarme))) bip();
    atualizarAlarme(lista, eu, cienteDoDisparo, disponivel || !eu.nome ? null : () => $('disp').click());
    const foco = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.ocorrencia : undefined;
    for (const id of ['aguardando', 'pendente', 'em_atendimento']) {
      const col = lista.filter((o) => o.situacao === id).sort((a, b) => a.prioridade - b.prioridade || a.abertaEm.localeCompare(b.abertaEm));
      $('n-' + id).textContent = col.length;
      $(id).replaceChildren(...(col.length ? col.map((o) => card(o, novas.includes(o))) : [el('div', 'vazio', 'Nada por aqui')]));
    }
    if (foco) { const campo = document.querySelector('input[data-ocorrencia="' + foco + '"]'); if (campo) { campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); } }
  } catch (e) { aviso(e.message); }
}

function mostrarEstado() {
  $('bolinha').className = 'bolinha' + (disponivel ? ' on' : '');
  $('estado').textContent = disponivel ? 'Disponível para atender' : 'Indisponível';
  $('disp').textContent = disponivel ? 'Ficar indisponível' : 'Ficar disponível';
  $('disp').className = disponivel ? '' : 'principal';
}

$('disp').onclick = async () => {
  // Pede para avisar no sistema quando a aba estiver em segundo plano (disparo com a Fila escondida).
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  try { await api('/api/operadores', { method: 'POST', body: JSON.stringify({ disponivel: !disponivel }) }); disponivel = !disponivel; mostrarEstado(); load(); } catch (e) { aviso(e.message); }
};
$('cancelar').onclick = () => $('dlg-concluir').close();
$('form-concluir').onsubmit = async (ev) => {
  ev.preventDefault();
  try {
    await api('/api/ocorrencias/' + concluindo.id + '/concluir', { method: 'POST', body: JSON.stringify({ motivo: $('motivo').value, conclusao: $('conclusao').value }) });
    $('dlg-concluir').close(); toast('Ocorrência concluída'); load();
  } catch (e) { $('dlg-erro').textContent = e.message; }
};

(async () => {
  eu = await iniciarTopo('fila');
  if (!eu.nome) { $('disp').disabled = true; $('estado').textContent = 'Acesso de serviço'; }
  disponivel = eu.disponivel; mostrarEstado();
  setInterval(load, 2000); load();
})();
</script>
</body>
</html>
