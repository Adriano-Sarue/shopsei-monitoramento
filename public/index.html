<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Sei Monitoramento</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1c2430; --mute:#6b7685; --line:#d9dde3; --p1:#c0392b; --p2:#e67e22; --p3:#d4ac0d; --p4:#2e86c1; --ok:#1e8449; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181d; --card:#1e242b; --ink:#e8ecf1; --mute:#9aa5b1; --line:#323a44; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:17px; margin:0 auto 0 0; }
  input, button, textarea { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  button { cursor:pointer; } button.main { background:var(--ok); color:#fff; border-color:var(--ok); }
  main { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; padding:12px 16px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  section h2 { font-size:14px; margin:0 0 8px; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; }
  .card { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--p4); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .card.p1 { border-left-color:var(--p1); } .card.p2 { border-left-color:var(--p2); } .card.p3 { border-left-color:var(--p3); }
  .card .top { display:flex; justify-content:space-between; gap:8px; font-weight:600; }
  .mute { color:var(--mute); font-size:13px; }
  .warn { color:var(--p1); font-weight:600; font-size:13px; }
  .acoes { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  #erro { color:var(--p1); padding:0 16px; min-height:20px; }
</style>
</head>
<body>
<header>
  <h1>Shop Sei Monitoramento</h1>
  <label>Token <input id="token" type="password" size="12"></label>
  <label>Operador <input id="operador" size="10"></label>
  <button id="disp" class="main">Ficar disponível</button>
</header>
<div id="erro"></div>
<main>
  <section><h2>Aguardando atendimento</h2><div id="aguardando"></div></section>
  <section><h2>Pendente (adiado)</h2><div id="pendente"></div></section>
  <section><h2>Em atendimento</h2><div id="em_atendimento"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
$('token').value = store.get('token'); $('operador').value = store.get('operador');
let disponivel = false;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { authorization: 'Bearer ' + $('token').value, 'content-type': 'application/json' } });
  const data = await r.json();
  if (!r.ok) throw new Error(data.erro || r.statusText);
  return data;
}
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function hora(iso) { return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

function card(o) {
  const c = el('div', 'card p' + Math.min(o.prioridade, 4));
  const top = el('div', 'top');
  top.append(el('span', '', 'Conta ' + o.conta), el('span', 'mute', hora(o.abertaEm)));
  c.append(top, el('div', '', o.resumo));
  if (!o.contaCadastrada) c.append(el('div', 'warn', 'Conta não cadastrada'));
  for (const e of o.eventos.slice(-4)) c.append(el('div', 'mute', hora(e.em) + ' · ' + e.codigo + ' ' + e.descricao + (e.zona ? ' · zona ' + e.zona : '')));
  if (o.operador) c.append(el('div', 'mute', 'Operador: ' + o.operador));
  if (o.adiadaAte) c.append(el('div', 'mute', 'Volta à fila às ' + hora(o.adiadaAte)));
  if (o.situacao === 'em_atendimento' && o.operador === $('operador').value.trim()) {
    const a = el('div', 'acoes');
    const concluir = el('button', 'main', 'Concluir');
    concluir.onclick = async () => {
      const motivo = prompt('Motivo da conclusão:'); if (!motivo) return;
      const conclusao = prompt('Texto de conclusão (opcional):') || '';
      try { await api('/api/ocorrencias/' + o.id + '/concluir', { method: 'POST', body: JSON.stringify({ operador: o.operador, motivo, conclusao }) }); load(); } catch (e) { $('erro').textContent = e.message; }
    };
    const adiar = el('button', '', 'Adiar 30 min');
    adiar.onclick = async () => {
      try { await api('/api/ocorrencias/' + o.id + '/adiar', { method: 'POST', body: JSON.stringify({ operador: o.operador, ate: new Date(Date.now() + 30 * 60000).toISOString() }) }); load(); } catch (e) { $('erro').textContent = e.message; }
    };
    a.append(concluir, adiar); c.append(a);
  }
  return c;
}

async function load() {
  try {
    const lista = await api('/api/ocorrencias');
    $('erro').textContent = '';
    for (const id of ['aguardando', 'pendente', 'em_atendimento']) $(id).replaceChildren(...lista.filter((o) => o.situacao === id).sort((a, b) => a.prioridade - b.prioridade || a.abertaEm.localeCompare(b.abertaEm)).map(card));
  } catch (e) { $('erro').textContent = e.message; }
}

$('disp').onclick = async () => {
  const nome = $('operador').value.trim(); if (!nome) { $('erro').textContent = 'Informe o nome do operador'; return; }
  store.set('token', $('token').value); store.set('operador', nome);
  disponivel = !disponivel;
  try { await api('/api/operadores', { method: 'POST', body: JSON.stringify({ nome, disponivel }) }); $('disp').textContent = disponivel ? 'Ficar indisponível' : 'Ficar disponível'; load(); } catch (e) { disponivel = !disponivel; $('erro').textContent = e.message; }
};
setInterval(load, 2000); load();
</script>
</body>
</html>
