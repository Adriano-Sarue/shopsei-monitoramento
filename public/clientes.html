<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes · Shop Sei Monitoramento</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="pagina cadastro">
  <section>
    <div class="barra"><input id="busca" type="search" placeholder="Buscar por nome, conta ou endereço"><span class="mute" id="total" style="align-self:center"></span></div>
    <div id="lista"></div>
  </section>
  <form id="form" class="cartao painel">
    <h2 id="titulo">Novo cliente</h2>
    <label>Nome <input id="nome" required></label>
    <label>Código da conta <input id="contas" required placeholder="0013">
      <span class="mute">É o número que a central de alarme do cliente envia em cada evento (o mesmo cadastrado na central e no Moni). É por ele que o sistema descobre de qual cliente é o alarme. Se o cliente tem mais de uma central, separe os códigos por vírgula (0013, 0014).</span>
    </label>
    <label>Endereço <input id="endereco"></label>
    <div class="grade">
      <label>Tipo <input id="tipo" placeholder="RESIDENCIAL"></label>
      <label>Observações <input id="observacoes"></label>
      <label>Palavra-chave <input id="palavraChave" autocomplete="off"></label>
      <label>Contra-senha <input id="contraSenha" autocomplete="off"></label>
    </div>
    <label>Instruções para o operador (valem mais que o plano padrão) <textarea id="instrucoes" rows="2" placeholder="Ex.: loja fecha às 22h; em disparo à noite, acionar o vigia da rua antes da polícia"></textarea></label>
    <label>Falta de teste periódico <select id="intervaloTesteHoras">
      <option value="">Não supervisionar</option><option value="1">Sem sinal por 1 hora</option><option value="6">Sem sinal por 6 horas</option>
      <option value="12">Sem sinal por 12 horas</option><option value="24">Sem sinal por 24 horas</option><option value="48">Sem sinal por 48 horas</option>
    </select></label>
    <fieldset><legend>Providências (ordem de ligação)</legend>
      <div class="grade"><label><input id="c1n" placeholder="Nome 1"></label><label><input id="c1t" placeholder="Telefone 1"></label>
      <label><input id="c2n" placeholder="Nome 2"></label><label><input id="c2t" placeholder="Telefone 2"></label>
      <label><input id="c3n" placeholder="Nome 3"></label><label><input id="c3t" placeholder="Telefone 3"></label></div>
    </fieldset>
    <fieldset><legend>Câmeras (abrem para o operador no disparo)</legend>
      <div class="grade">
        <label><input id="k1n" placeholder="Nome 1 (ex.: Entrada)"></label><label><input id="k1m" placeholder="Marca (Intelbras, Hikvision…)"></label>
        <label style="grid-column:1/-1"><input id="k1u" placeholder="Link 1 (https://…)"></label>
        <label><input id="k2n" placeholder="Nome 2"></label><label><input id="k2m" placeholder="Marca"></label>
        <label style="grid-column:1/-1"><input id="k2u" placeholder="Link 2 (https://…)"></label>
        <label><input id="k3n" placeholder="Nome 3"></label><label><input id="k3m" placeholder="Marca"></label>
        <label style="grid-column:1/-1"><input id="k3u" placeholder="Link 3 (https://…)"></label>
      </div>
      <p class="mute" style="margin:0 0 10px">Use o link do visualizador web ou da nuvem da marca. Evite colocar a senha da câmera no link.</p>
    </fieldset>
    <div id="msg" class="msg" role="status"></div>
    <div style="display:flex;gap:8px"><button class="marca-btn" type="submit">Salvar</button><button type="button" id="limpar">Novo</button></div>
  </form>
</main>
<script src="/app.js"></script>
<script>
let editando = null, clientes = [];
const CAMPOS = ['instrucoes', 'intervaloTesteHoras', 'nome', 'contas', 'endereco', 'tipo', 'observacoes', 'palavraChave', 'contraSenha', 'c1n', 'c1t', 'c2n', 'c2t', 'c3n', 'c3t', 'k1n', 'k1m', 'k1u', 'k2n', 'k2m', 'k2u', 'k3n', 'k3m', 'k3u'];

function limpar() { editando = null; $('titulo').textContent = 'Novo cliente'; for (const id of CAMPOS) $(id).value = ''; }
function editar(c) {
  editando = c.id; $('titulo').textContent = 'Editar ' + c.nome;
  $('nome').value = c.nome; $('contas').value = c.contas.join(', '); $('endereco').value = c.endereco || ''; $('tipo').value = c.tipo || '';
  $('observacoes').value = c.observacoes || ''; $('instrucoes').value = c.instrucoes || ''; $('intervaloTesteHoras').value = c.intervaloTesteHoras ? String(c.intervaloTesteHoras) : ''; $('palavraChave').value = c.palavraChave || ''; $('contraSenha').value = c.contraSenha || '';
  [1, 2, 3].forEach((n) => { const ct = c.contatos[n - 1]; $('c' + n + 'n').value = ct ? ct.nome : ''; $('c' + n + 't').value = ct ? ct.telefone || '' : ''; });
  [1, 2, 3].forEach((n) => { const k = (c.cameras || [])[n - 1]; $('k' + n + 'n').value = k ? k.nome : ''; $('k' + n + 'm').value = k ? k.marca || '' : ''; $('k' + n + 'u').value = k ? k.url : ''; });
  window.scrollTo({ top: 0, behavior: 'smooth' }); $('nome').focus();
}
function desenhar() {
  const q = $('busca').value.trim().toLowerCase();
  const vis = clientes.filter((c) => !q || [c.nome, c.endereco || '', ...c.contas].join(' ').toLowerCase().includes(q));
  $('total').textContent = vis.length + ' de ' + clientes.length;
  $('lista').replaceChildren(...(vis.length ? vis.map((c) => {
    const d = el('div', 'cartao item');
    const t = el('div'); t.append(el('strong', '', c.nome), el('div', 'mute', 'Contas: ' + c.contas.join(', ') + (c.tipo ? ' · ' + c.tipo : '')));
    if (c.endereco) t.append(el('div', 'mute', c.endereco));
    const b = el('button', '', 'Editar'); b.onclick = () => editar(c);
    d.append(t, b); return d;
  }) : [el('div', 'vazio', clientes.length ? 'Nenhum cliente encontrado' : 'Nenhum cliente cadastrado ainda')]));
}
async function carregar() { try { clientes = await api('/api/clientes'); desenhar(); } catch (e) { mensagem('msg', e.message, 'erro'); } }

$('form').onsubmit = async (ev) => {
  ev.preventDefault();
  const contatos = [1, 2, 3].map((n) => ({ nome: $('c' + n + 'n').value, telefone: $('c' + n + 't').value, ordem: n })).filter((c) => c.nome.trim());
  const cameras = [1, 2, 3].map((n) => ({ nome: $('k' + n + 'n').value, marca: $('k' + n + 'm').value, url: $('k' + n + 'u').value, ordem: n })).filter((k) => k.nome.trim() || k.url.trim());
  const body = { nome: $('nome').value, contas: $('contas').value.split(',').map((s) => s.trim()).filter(Boolean), endereco: $('endereco').value, tipo: $('tipo').value, observacoes: $('observacoes').value, palavraChave: $('palavraChave').value, contraSenha: $('contraSenha').value, instrucoes: $('instrucoes').value, intervaloTesteHoras: $('intervaloTesteHoras').value || null, contatos, cameras };
  try {
    await api(editando ? '/api/clientes/' + editando : '/api/clientes', { method: editando ? 'PUT' : 'POST', body: JSON.stringify(body) });
    toast('Cliente salvo'); mensagem('msg', ''); limpar(); carregar();
  } catch (e) { mensagem('msg', e.message, 'erro'); }
};
$('limpar').onclick = limpar;
$('busca').oninput = desenhar;
(async () => { await iniciarTopo('clientes'); carregar(); })();
</script>
</body>
</html>
